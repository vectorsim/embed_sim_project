<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180">
  <defs>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f6ff"/>
      <stop offset="100%" style="stop-color:#ddeaf8"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0050a0"/>
      <stop offset="100%" style="stop-color:#0077cc"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cc4400"/>
      <stop offset="100%" style="stop-color:#ff7700"/>
    </linearGradient>

    <linearGradient id="surfGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#c8e0ff"/>
      <stop offset="60%" style="stop-color:#a0c4f0"/>
      <stop offset="100%" style="stop-color:#7aaade"/>
    </linearGradient>

    <linearGradient id="tangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbe8" stop-opacity="0.95"/>
      <stop offset="100%" style="stop-color:#ffe9b0" stop-opacity="0.80"/>
    </linearGradient>

    <clipPath id="bgClip">
      <rect width="560" height="180" rx="14"/>
    </clipPath>

  </defs>

  <!-- Background -->
  <rect width="560" height="180" rx="14" fill="url(#bgGrad)"/>

  <!-- Faint grid -->
  <g clip-path="url(#bgClip)" opacity="0.10" stroke="#4080c0" stroke-width="0.5">
    <line x1="40"  y1="0" x2="40"  y2="180"/>
    <line x1="80"  y1="0" x2="80"  y2="180"/>
    <line x1="120" y1="0" x2="120" y2="180"/>
    <line x1="160" y1="0" x2="160" y2="180"/>
    <line x1="200" y1="0" x2="200" y2="180"/>
    <line x1="240" y1="0" x2="240" y2="180"/>
    <line x1="280" y1="0" x2="280" y2="180"/>
    <line x1="320" y1="0" x2="320" y2="180"/>
    <line x1="360" y1="0" x2="360" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="440" y1="0" x2="440" y2="180"/>
    <line x1="480" y1="0" x2="480" y2="180"/>
    <line x1="520" y1="0" x2="520" y2="180"/>
    <line x1="0" y1="40"  x2="560" y2="40"/>
    <line x1="0" y1="80"  x2="560" y2="80"/>
    <line x1="0" y1="120" x2="560" y2="120"/>
    <line x1="0" y1="160" x2="560" y2="160"/>
  </g>

  <!-- Icon white card -->
  <rect x="12" y="12" width="162" height="156" rx="11"
        fill="white" opacity="0.72"/>

  <!-- ═══════════════════════════════════════════════════
       MANIFOLD ICON
       A curved 2-manifold surface in 3D perspective,
       with tangent plane, geodesic, and tangent vector.
       ═══════════════════════════════════════════════════ -->

  <!-- Manifold surface fill -->
  <path d="
    M 28 115
    C 45  90,  70  58,  95  50
    C 120 42, 148  55, 158  78
    C 148 100, 130 128, 108 138
    C  86 148,  50 140,  28 115
    Z"
    fill="url(#surfGrad)" opacity="0.88"/>

  <!-- Surface boundary -->
  <path d="
    M 28 115
    C 45  90,  70  58,  95  50
    C 120 42, 148  55, 158  78
    C 148 100, 130 128, 108 138
    C  86 148,  50 140,  28 115
    Z"
    fill="none" stroke="#3a70b8" stroke-width="1.6" opacity="0.7"/>

  <!-- Parametric grid — u-lines -->
  <path d="M 40 110  C 60  88,  85  70, 110  67  C 128  65, 148  72, 155  82"
        fill="none" stroke="#2a5a9a" stroke-width="0.9" opacity="0.55"/>
  <path d="M 34 122  C 55 100,  80  82, 105  78  C 128  75, 148  84, 156  96"
        fill="none" stroke="#2a5a9a" stroke-width="0.9" opacity="0.45"/>
  <path d="M 50  96  C 68  78,  90  62, 112  59  C 132  57, 150  64, 156  74"
        fill="none" stroke="#2a5a9a" stroke-width="0.9" opacity="0.45"/>

  <!-- Parametric grid — v-lines -->
  <path d="M  63  56  C  58  76,  52 100,  48 122"
        fill="none" stroke="#2a5a9a" stroke-width="0.9" opacity="0.45"/>
  <path d="M  95  51  C  90  70,  84  95,  78 125"
        fill="none" stroke="#2a5a9a" stroke-width="0.9" opacity="0.45"/>
  <path d="M 128  54  C 126  74, 120 100, 112 132"
        fill="none" stroke="#2a5a9a" stroke-width="0.9" opacity="0.45"/>

  <!-- Tangent plane T_p M — parallelogram in perspective -->
  <polygon points="62,62  130,52  134,100  66,110"
           fill="url(#tangGrad)" opacity="0.72"/>
  <polygon points="62,62  130,52  134,100  66,110"
           fill="none" stroke="#cc6600" stroke-width="1.4"
           stroke-dasharray="4,3" opacity="0.85"/>

  <!-- Tangent plane label -->
  <text x="116" y="60" font-family="Georgia,serif" font-size="10"
        font-style="italic" fill="#995500" opacity="0.95">T&#x2091;M</text>

  <!-- Point p on manifold -->
  <circle cx="97" cy="82" r="4.5" fill="#0055bb" stroke="white" stroke-width="1.8"/>
  <text x="104" y="79" font-family="Georgia,serif" font-size="11"
        font-style="italic" font-weight="700" fill="#003080">p</text>

  <!-- Geodesic γ(t) through p -->
  <path d="M 44 128  C 65 105, 82 90, 97 82  C 112 74, 130 66, 152 62"
        fill="none" stroke="#0077cc" stroke-width="2"
        stroke-dasharray="5,3" stroke-linecap="round" opacity="0.85"/>
  <text x="30" y="140" font-family="Georgia,serif" font-size="10"
        font-style="italic" fill="#0055aa" opacity="0.9">&#x03B3;(t)</text>

  <!-- Tangent vector v at p -->
  <line x1="97" y1="82" x2="122" y2="67"
        stroke="#cc4400" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="122,67 113,64 116,73" fill="#cc4400"/>
  <text x="125" y="65" font-family="Georgia,serif" font-size="11"
        font-style="italic" font-weight="700" fill="#cc4400">v</text>

  <!-- Chart symbol φ -->
  <text x="136" y="137" font-family="Georgia,serif" font-size="10"
        font-style="italic" fill="#3a70b8" opacity="0.8">&#x03C6;</text>

  <!-- ── "M" label top-left of surface ── -->
  <text x="22" y="42" font-family="Georgia,serif" font-size="13"
        font-style="italic" font-weight="700" fill="#1a4080" opacity="0.7">M</text>

  <!-- ═══════════════════════════════════════════════
       DIVIDER
       ═══════════════════════════════════════════════ -->
  <line x1="184" y1="22" x2="184" y2="158"
        stroke="#b0c8e8" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════
       WORDMARK
       ═══════════════════════════════════════════════ -->

  <!-- "EmbedSim" on one line — "Embed" navy, "Sim" orange -->
  <text x="202" y="104"
        font-family="'Courier New', Courier, monospace"
        font-size="46" font-weight="700" letter-spacing="-1"
        fill="#0a2a5e">Embed<tspan fill="url(#orangeGrad)">Sim</tspan></text>

  <!-- Underline accent -->
  <rect x="202" y="111" width="295" height="3.5" rx="2"
        fill="url(#orangeGrad)" opacity="0.45"/>

  <!-- Tagline -->
  <text x="203" y="135"
        font-family="'Courier New', Courier, monospace"
        font-size="11" letter-spacing="3"
        fill="#0a1a2e">EMBEDDED CONTROL · OPEN SOURCE</text>

  <!-- Version badge -->
  <rect x="462" y="13" width="82" height="22" rx="11"
        fill="#0050a0" opacity="0.12" stroke="#0060c0" stroke-width="1.2"/>
  <text x="503" y="28"
        font-family="'Courier New', Courier, monospace"
        font-size="11" font-weight="700"
        fill="#0050a0" text-anchor="middle">ESF v2.0</text>

  <!-- Corner bracket accents -->
  <path d="M14 14 L14 34 M14 14 L34 14"
        fill="none" stroke="#0060b8" stroke-width="1.5"
        stroke-linecap="round" opacity="0.4"/>
  <path d="M546 166 L546 146 M546 166 L526 166"
        fill="none" stroke="#cc4400" stroke-width="1.5"
        stroke-linecap="round" opacity="0.4"/>

</svg>
